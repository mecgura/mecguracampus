<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students — MecguraCampus</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="students">
<div class="mc-shell">
<aside class="mc-side" id="mc-side"></aside>
<main class="mc-main">
  <div class="mc-top" id="mc-top">
    <div><h1>Students</h1><p>Every child, every class — print ID cards in one click.</p></div>
    <div class="mc-actions"><button class="btn btn-o" onclick="window.print()">Print ID Cards</button><button class="btn btn-g" onclick="MC.openModal('mAdd')">+ Add Student</button></div>
  </div>
  <div class="card">
    <div class="toolbar"><input id="q" placeholder="Search by name or class…" oninput="render()"><select id="f" onchange="render()"><option value="">All schools</option></select></div>
    <div style="overflow-x:auto"><table class="tbl" id="tbl"></table></div>
  </div>
  <div class="card mt print-area" id="idCard" style="max-width:420px">
    <h2>Student ID Card <span class="small">(preview — press Print above)</span></h2>
    <div id="idBody"></div>
  </div>
</main>
</div>
<div class="modal-bg" id="mAdd"><div class="modal">
  <h3>New Student</h3>
  <div class="fld"><label>Full name</label><input id="n" placeholder="Student's full name"></div>
  <div class="frow"><div class="fld"><label>Class / Section</label><input id="cl" placeholder="10-A"></div>
  <div class="fld"><label>Monthly fee (Rs.)</label><input id="fe" type="number" value="3500"></div></div>
  <div class="fld"><label>School</label><select id="sc"></select></div>
  <div class="fld"><label>Parent mobile number</label><input id="ph" placeholder="98XXX-XXXXX"></div>
  <div style="display:flex;gap:8px"><button class="btn btn-g" onclick="addStu()">Add Student</button><button class="btn btn-o" onclick="MC.closeModal('mAdd')">Cancel</button></div>
</div></div>
<script src="assets/app.js"></script>
<script>
function fillSchools(){ var s=document.getElementById("sc"); s.innerHTML=MC.DB.schools.map(function(x){return '<option value="'+x.id+'">'+MC.esc(x.name)+'</option>';}).join("");
  var f=document.getElementById("f"); f.innerHTML='<option value="">All schools</option>'+MC.DB.schools.map(function(x){return '<option value="'+x.id+'">'+MC.esc(x.name)+'</option>';}).join(""); }
function render(){
  var q=(document.getElementById("q").value||"").toLowerCase(), f=document.getElementById("f").value;
  var rows=MC.DB.students.filter(function(s){return (!q||(s.name+s.cls).toLowerCase().includes(q))&&(!f||s.school===f);})
  .map(function(s){
    var att=s.att>=85?'<span class="bdg g">'+s.att+'%</span>':(s.att>=75?'<span class="bdg a">'+s.att+'%</span>':'<span class="bdg r">'+s.att+'%</span>');
    var fee=s.due>0?'<span class="bdg a">'+MC.inr(s.due)+' due</span>':'<span class="bdg g">Clear</span>';
    return "<tr><td><b>"+MC.esc(s.name)+"</b><br><span class='small'>"+MC.esc(s.cls)+" • "+MC.esc(MC.schoolName(s.school))+"</span></td><td>"+att+"</td><td>"+fee+"</td><td class='small'>"+MC.esc(s.phone)+"</td>"
    +"<td><button class='btn btn-o btn-sm' onclick=\"idCard('"+s.id+"')\">ID Card</button></td></tr>";
  });
  document.getElementById("tbl").innerHTML="<tr><th>Student</th><th>Attendance</th><th>Fees</th><th>Parent Contact</th><th></th></tr>"+(rows.join("")||"<tr><td colspan=5 class='small'>No students found.</td></tr>");
}
function idCard(id){ var s=MC.DB.students.find(function(x){return x.id===id;});
  document.getElementById("idBody").innerHTML='<div style="border:2px solid #0C160D;border-radius:14px;padding:18px;display:flex;gap:14px;align-items:center"><div style="width:56px;height:56px;border-radius:14px;background:#78ce57;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#062026">'+MC.esc(s.name[0])+'</div><div><b>'+MC.esc(s.name)+'</b><div class="small">Class '+MC.esc(s.cls)+' • 2026-27</div><div class="small">'+MC.esc(MC.schoolName(s.school))+'</div><div class="small">Campus ID: '+s.id.toUpperCase()+'</div></div></div>';
  MC.toast("ID card ready. Press Print."); document.getElementById("idCard").scrollIntoView({behavior:"smooth"});
}
function addStu(){ var n=document.getElementById("n").value.trim(); if(!n){MC.toast("Please enter the student's name.");return;}
  var fe=+document.getElementById("fe").value||0;
  MC.DB.students.push({id:MC.uid("st"),name:n,cls:document.getElementById("cl").value||"—",school:document.getElementById("sc").value,fee:fe,due:fe,phone:document.getElementById("ph").value||"—",att:100});
  MC.save();MC.closeModal("mAdd");render();MC.toast("Student added. Welcome SMS sent to parent.");
}
fillSchools(); render();
</script>
</body>
</html>
